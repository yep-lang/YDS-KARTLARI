<style>
/* Layout: tek sütun — ana sayfada deste kutuları, çalışmada ortada tek dizin kartı ve altında Zor / Orta / Kolay */
:root {
  --bg: #EDF0F5;
  --paper: #FFFFFF;
  --paper-2: #F5F7FA;
  --ink: #172033;
  --muted: #5B667A;
  --line: #D5DCE6;
  --rule: #DFE7F3;
  --margin: #E8898B;
  --accent: #2647C9;
  --accent-ink: #FFFFFF;
  --mark: #FFE45C;
  --orta: #17936A;
  --iyi: #B97C0B;
  --zor: #CF3F45;
  --baglac: #2647C9;
  --kalip: #7A4FC4;
  --karisik: #172033;
  --hard: #CF3F45;
  --mid: #B97C0B;
  --easy: #17936A;
  --hard-soft: #FBE3E4;
  --mid-soft: #FBF0D9;
  --easy-soft: #DDF3EA;
  --shadow: 0 1px 2px rgba(23,32,51,.06), 0 10px 28px rgba(23,32,51,.09);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --paper: #171F2C; --paper-2: #1C2535; --ink: #E6EBF2; --muted: #98A3B5;
    --line: #2A3547; --rule: #223049; --margin: #9C4A52; --accent: #7F9BFF; --accent-ink: #0E131B; --mark: #8A7414;
    --orta: #3CC492; --iyi: #E0A93A; --zor: #F06D72; --baglac: #7F9BFF; --kalip: #B795F2; --karisik: #E6EBF2;
    --hard: #F06D72; --mid: #E0A93A; --easy: #3CC492; --hard-soft: #43222A; --mid-soft: #3D3118; --easy-soft: #173A2E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --paper: #171F2C; --paper-2: #1C2535; --ink: #E6EBF2; --muted: #98A3B5;
  --line: #2A3547; --rule: #223049; --margin: #9C4A52; --accent: #7F9BFF; --accent-ink: #0E131B; --mark: #8A7414;
  --orta: #3CC492; --iyi: #E0A93A; --zor: #F06D72; --baglac: #7F9BFF; --kalip: #B795F2; --karisik: #E6EBF2;
  --hard: #F06D72; --mid: #E0A93A; --easy: #3CC492; --hard-soft: #43222A; --mid-soft: #3D3118; --easy-soft: #173A2E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 720px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }

/* Üst bölüm */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
.logo { flex: none; width: 44px; height: 44px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .02em; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1.1; letter-spacing: -.01em; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; color: var(--muted); cursor: pointer; font-size: 13px; white-space: nowrap; }
.ghost:hover { color: var(--ink); border-color: var(--muted); }
.top-actions { display: flex; gap: 8px; }

/* Ana sayfa */
h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--muted); }
.due-banner { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--hard); border-radius: 12px; padding: 14px 16px; }
.due-banner b { font-variant-numeric: tabular-nums; }
.decks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.deck { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; min-width: 0; }
.deck::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.deck:hover { border-color: var(--c); box-shadow: var(--shadow); }
.deck-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.deck-name { font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1.1; }
.deck-total { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.deck-desc { color: var(--muted); font-size: 13px; margin-top: -4px; }
.deck-nums { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; font-variant-numeric: tabular-nums; }
.deck-nums div { display: flex; flex-direction: column; }
.deck-nums b { font-size: 17px; font-weight: 600; }
.deck-nums span { font-size: 11px; color: var(--muted); font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .05em; }
.deck-nums .n-due b { color: var(--hard); }
.deck-nums .n-learn b { color: var(--easy); }
.meter { height: 5px; border-radius: 3px; background: var(--paper-2); overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--c); width: 0; }
.how { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.how div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.how b { font-weight: 600; }
.how span { color: var(--muted); font-size: 13px; }
.chip { display: inline-block; align-self: flex-start; font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 5px; color: var(--c); background: var(--cs); }

/* Çalışma ekranı */
.study-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.study-bar .title { font-family: var(--f-display); font-weight: 800; font-size: 18px; }
.study-bar .bar { flex: 1; min-width: 120px; height: 6px; border-radius: 3px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
.study-bar .bar i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
.pill:hover { border-color: var(--muted); }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); min-height: 340px; padding: 22px 24px 24px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.card::before { content: ""; position: absolute; left: 0; right: 0; top: 60px; height: 2px; background: var(--margin); opacity: .5; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 28px; }
.card-top .right { display: flex; gap: 6px; align-items: center; }
.tag { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 5px; border: 1px solid currentColor; color: var(--c); white-space: nowrap; }
.state { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.front { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 8px; padding: 38px 0 18px; }
.word { font-family: var(--f-display); font-weight: 700; font-size: clamp(32px, 7.5vw, 50px); line-height: 1.08; letter-spacing: -.015em; overflow-wrap: anywhere; text-wrap: balance; }
.word.long { font-size: clamp(22px, 4.8vw, 31px); }
.word .hl { background: linear-gradient(transparent 58%, var(--mark) 58% 92%, transparent 92%); padding: 0 .06em; }
.pos { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.back { display: flex; flex-direction: column; gap: 14px; border-top: 1px dashed var(--line); padding-top: 18px; animation: rise .25s ease; }
@keyframes rise { from { opacity: .3; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.meaning-label, .ex-label { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.meaning { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 5vw, 30px); line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; margin-top: 2px; }
.use { align-self: flex-start; font-family: var(--f-mono); font-size: 12.5px; color: var(--ink); background: var(--paper-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; }
.ex { background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
  background-image: repeating-linear-gradient(to bottom, transparent 0 25px, var(--rule) 25px 26px); background-position: 0 30px; }
.ex .en { font-size: 16px; }
.ex .en mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.ex .tr { color: var(--muted); font-size: 14px; }
.speak { border: 1px solid var(--line); background: var(--paper-2); border-radius: 8px; width: 34px; height: 30px; display: grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
.speak:hover { color: var(--accent); border-color: var(--accent); }
.speak svg { width: 16px; height: 16px; }
.ex-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.reveal { width: 100%; border: 0; border-radius: 14px; padding: 16px; font-weight: 600; font-size: 16px; cursor: pointer; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; gap: 10px; }
.reveal:hover { filter: brightness(1.07); }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; opacity: .75; font-weight: 500; }
.grade { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.g { border-radius: 14px; padding: 12px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid var(--c); background: var(--cs); color: var(--ink); }
.g b { font-family: var(--f-display); font-weight: 800; font-size: 19px; color: var(--c); line-height: 1.2; }
.g span { font-size: 12px; color: var(--muted); text-align: center; }
.g:hover { filter: brightness(.97); }
.g.hard { --c: var(--hard); --cs: var(--hard-soft); }
.g.mid { --c: var(--mid); --cs: var(--mid-soft); }
.g.easy { --c: var(--easy); --cs: var(--easy-soft); }
.hint { text-align: center; color: var(--muted); font-size: 12px; }

/* Panel (bitti / boş) */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 26px 22px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.panel p { margin: 0; color: var(--muted); max-width: 56ch; }
.score { display: flex; gap: 26px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.score div { display: flex; flex-direction: column; }
.score b { font-family: var(--f-display); font-size: 34px; line-height: 1; }
.score span { font-size: 11px; color: var(--muted); font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { border-radius: 12px; padding: 11px 18px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--paper); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { background: var(--hard); border-color: var(--hard); color: var(--paper); }
.missed { align-self: stretch; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.missed div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.missed span { color: var(--muted); text-align: right; }

/* Arama */
.search { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px 14px; font: inherit; color: var(--ink); }
.search::placeholder { color: var(--muted); }
.list { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 10px minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px; align-items: start; padding: 11px 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-top: 7px; }
.row .w { font-weight: 600; overflow-wrap: anywhere; }
.row .w small { display: block; font-family: var(--f-mono); font-weight: 500; color: var(--muted); font-size: 11px; }
.row .m { overflow-wrap: anywhere; }
.row .m em { display: block; font-style: normal; font-size: 13px; color: var(--muted); margin-top: 2px; }
.list-meta { font-size: 13px; color: var(--muted); }
.more { display: flex; justify-content: center; }

.confirm { background: var(--hard-soft); border: 1px solid var(--hard); border-radius: 12px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.confirm p { margin: 0; font-size: 14px; }
.confirm .btn { padding: 8px 14px; font-size: 14px; }
.keys { text-align: center; color: var(--muted); font-size: 12px; }
.keys kbd { border-color: var(--line); background: var(--paper); opacity: 1; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }

@media (max-width: 620px) {
  .decks { grid-template-columns: 1fr; }
  .how { grid-template-columns: 1fr; }
  .card { padding: 18px 16px 20px; min-height: 300px; }
  .row { grid-template-columns: 10px minmax(0, 1fr); }
  .row .m { grid-column: 2; }
  .keys { display: none; }
  h1 { font-size: 21px; }
  .g { padding: 11px 4px; }
}
@media (prefers-reduced-motion: reduce) {
  .back { animation: none; }
  .study-bar .bar i { transition: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <button class="logo" type="button" data-go="home" aria-label="Ana sayfaya dön" style="border:0;cursor:pointer">YDS</button>
      <div>
        <h1>YDS Kartları</h1>
        <p class="sub" id="sub">Yükleniyor…</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="ghost" type="button" data-go="ara">Kelime ara</button>
    </div>
  </header>
  <div id="confirmBox" hidden></div>
  <main id="view"><div class="loading">Kartlar hazırlanıyor…</div></main>
  <footer class="keys" id="keys"></footer>
</div>

r dakika bekle."],["Phrasal Verb","give away","bedavaya vermek; ele vermek","He gave away his fortune.","Servetini dağıttı."],["Phrasal Verb","look over","gözden geçirmek","Can you look over my essay?","Kompozisyonuma göz atar mısın?"],["Phrasal Verb","speed up","hızlandırmak","We must speed up the process.","Süreci hızlandırmalıyız."],["Phrasal Verb","slow down","yavaşlamak","The economy slowed down.","Ekonomi yavaşladı."]]};</script>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => n.toLocaleString('tr-TR');
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const SESSION = 20;
  const MIN = 60 * 1000, DAY = 24 * 60 * MIN;
  const DAYS = [0, 1, 3, 7, 14, 30, 60];          // kutu → gün
  const POS = { n: 'isim', v: 'fiil', adj: 'sıfat', adv: 'zarf', prep: 'edat', conj: 'bağlaç' };
  const DECKS = [
    { id: 'orta', name: 'Orta', desc: 'Sık çıkan temel kelimeler', c: '--orta' },
    { id: 'iyi', name: 'İyi', desc: 'Akademik metin kelimeleri', c: '--iyi' },
    { id: 'zor', name: 'Zor', desc: 'Puan farkı yaratan kelimeler', c: '--zor' },
    { id: 'baglac', name: 'Bağlaçlar', desc: 'Zıtlık, sebep, sonuç, koşul…', c: '--baglac' },
    { id: 'kalip', name: 'Kalıplar', desc: 'Soru kalıpları, edatlar, phrasal verb', c: '--kalip' },
    { id: 'karisik', name: 'Karışık', desc: 'Hepsi bir arada, rastgele', c: '--karisik' },
  ];
  const DECK = Object.fromEntries(DECKS.map(d => [d.id, d]));
  const LVL_LABEL = { orta: 'Orta', iyi: 'İyi', zor: 'Zor', baglac: 'Bağlaç', kalip: 'Kalıp' };
  const SPEAK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

  // ---------- Kayıt ----------
  const KEY = 'yds-kartlar-v2';
  let store = { cards: {}, settings: {} };
  try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw); store = { cards: p.cards || {}, settings: p.settings || {} }; } } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
  const S = Object.assign({ dir: 'en' }, store.settings);
  const saveSettings = () => { store.settings = { dir: S.dir }; save(); };

  let ALL = [], BYID = {}, view = 'home', session = null, searchQ = '', searchLimit = 100;
  const canSpeak = 'speechSynthesis' in window;
  function speak(text) {
    if (!canSpeak) return;
    try { const u = new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g, '')); u.lang = 'en-US'; u.rate = 0.92; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
  }

  // ---------- Veri ----------
  async function load() {
    const get = f => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.json(); });
    const E = window.__YDS_DATA;
    const [w, b, k] = E ? [E.w, E.b, E.k] : await Promise.all([get('kelimeler.json'), get('baglaclar.json'), get('kaliplar.json')]);
    const W = w.map(r => ({ id: 'w:' + r[0] + '|' + r[1], type: 'w', en: r[0], pos: r[1], tr: r[2], lvl: r[3], exEn: r[4] || '', exTr: r[5] || '' }));
    const B = b.map(r => ({ id: 'b:' + r[1], type: 'b', lvl: 'baglac', cat: r[0], en: r[1], tr: r[2], use: r[3], exEn: r[4], exTr: r[5] }));
    const K = k.map(r => ({ id: 'k:' + r[1], type: 'k', lvl: 'kalip', cat: r[0], en: r[1], tr: r[2], exEn: r[3], exTr: r[4] }));
    ALL = W.concat(B, K);
    ALL.forEach(x => { BYID[x.id] = x; });
    const uniq = new Set(W.map(x => x.en.toLowerCase())).size;
    $('#sub').textContent = `${fmt(uniq)} kelime · ${fmt(B.length)} bağlaç · ${fmt(K.length)} kalıp`;
  }
  const deckItems = id => id === 'karisik' ? ALL : id === 'tekrar' ? ALL.filter(isDue) : ALL.filter(x => x.lvl === id);
  const st = x => store.cards[x.id];
  const isNew = x => !st(x);
  const isDue = x => { const s = st(x); return !!s && s.d <= Date.now(); };
  const isLearned = x => { const s = st(x); return !!s && s.b >= 2; };

  // ---------- Aralıklı tekrar ----------
  function nextState(x, grade) {
    const s = st(x) || { b: 0, d: 0 };
    const now = Date.now();
    if (grade === 'hard') return { b: 0, d: now + MIN };
    if (grade === 'mid') { const b = Math.max(1, s.b); return { b, d: now + DAY }; }
    const b = Math.min(DAYS.length - 1, s.b === 0 && !st(x) ? 2 : s.b + 1);
    return { b, d: now + DAYS[b] * DAY };
  }
  function whenLabel(x, grade) {
    if (grade === 'hard') return 'birazdan tekrar';
    if (grade === 'mid') return 'yarın tekrar';
    const n = nextState(x, 'easy'); const d = DAYS[n.b];
    return d >= 30 ? Math.round(d / 30) + ' ay sonra' : d + ' gün sonra';
  }

  // ---------- Oturum ----------
  function startSession(deckId) {
    const items = deckItems(deckId);
    const due = items.filter(isDue).sort((a, b) => st(a).d - st(b).d).slice(0, SESSION);
    const fresh = deckId === 'tekrar' ? [] : shuffle(items.filter(isNew)).slice(0, SESSION - due.length);
    const queue = shuffle(due.concat(fresh));
    session = { deck: deckId, queue, total: queue.length, done: 0, shown: false, res: { hard: 0, mid: 0, easy: 0 }, missed: new Set(), requeued: {} };
    view = 'study';
    render();
  }
  function grade(g) {
    const s = session; if (!s || !s.queue.length || !s.shown) return;
    const x = s.queue.shift();
    store.cards[x.id] = nextState(x, g);
    save();
    const first = !s.requeued[x.id];
    if (first) { s.res[g]++; s.done++; }
    if (g === 'hard') {
      s.missed.add(x.id);
      s.requeued[x.id] = (s.requeued[x.id] || 0) + 1;
      if (s.requeued[x.id] <= 3) s.queue.splice(Math.min(3, s.queue.length), 0, x);
    } else if (g === 'mid' && first) {
      s.requeued[x.id] = 1;
      s.queue.push(x);
    }
    s.shown = false;
    render();
  }

  // ---------- Görünümler ----------
  function render() {
    if (view === 'home') renderHome();
    else if (view === 'study') renderStudy();
    else if (view === 'ara') renderSearch(true);
    window.scrollTo({ top: 0 });
  }

  function renderHome() {
    const dueAll = ALL.filter(isDue).length;
    const cards = DECKS.map(d => {
      const items = deckItems(d.id);
      const n = items.filter(isNew).length, due = items.filter(isDue).length, learned = items.filter(isLearned).length;
      const pct = items.length ? Math.round(learned / items.length * 100) : 0;
      return `<button type="button" class="deck" data-deck="${d.id}" style="--c:var(${d.c})">
        <div class="deck-head"><span class="deck-name">${d.name}</span><span class="deck-total">${fmt(items.length)} kart</span></div>
        <span class="deck-desc">${d.desc}</span>
        <div class="deck-nums">
          <div><b>${fmt(n)}</b><span>Yeni</span></div>
          <div class="n-due"><b>${fmt(due)}</b><span>Tekrar</span></div>
          <div class="n-learn"><b>${fmt(learned)}</b><span>Öğrendim</span></div>
        </div>
        <div class="meter" title="%${pct} öğrenildi"><i style="width:${pct}%"></i></div>
      </button>`;
    }).join('');
    $('#view').innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px">
        <div><h2>Bugün hangi desteyi çalışalım?</h2><p class="lead">Bir desteye dokun, ${SESSION} kartlık bir tur başlasın. Kartı çevir, sonra ne kadar bildiğini işaretle.</p></div>
        ${dueAll ? `<div class="due-banner"><span><b>${fmt(dueAll)}</b> kartın tekrar zamanı geldi.</span><button type="button" class="btn primary" data-deck="tekrar">Tekrarları çalış</button></div>` : ''}
        <div class="decks">${cards}</div>
        <div class="how">
          <div><span class="chip" style="--c:var(--hard);--cs:var(--hard-soft)">Zor</span><b>Bilemedim</b><span>Kart birkaç kart sonra yine gelir.</span></div>
          <div><span class="chip" style="--c:var(--mid);--cs:var(--mid-soft)">Orta</span><b>Zorlandım</b><span>Tur sonunda bir kez daha, sonra yarın gelir.</span></div>
          <div><span class="chip" style="--c:var(--easy);--cs:var(--easy-soft)">Kolay</span><b>Biliyorum</b><span>Günler sonra gelir. Bildikçe aralık uzar.</span></div>
        </div>
        <div><button type="button" class="ghost" id="resetBtn">İlerlemeyi sıfırla</button></div>
      </div>`;
    $('#keys').innerHTML = '';
  }

  function highlight(sentence, word) {
    const safe = esc(sentence);
    if (!word || /\s/.test(word.trim()) && word.split(' ').length > 3) return safe;
    const base = word.toLowerCase().replace(/[^a-z' -]/g, '').trim();
    if (!base) return safe;
    const stem = base.includes(' ') ? base : base.length > 5 ? base.slice(0, base.length - (base.endsWith('e') || base.endsWith('y') ? 1 : 2)) : base;
    const pat = stem.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+');
    try {
      const re = new RegExp('\\b(' + pat + "[a-z]*)", 'i');
      return safe.replace(re, '<mark>$1</mark>');
    } catch (e) { return safe; }
  }

  function renderStudy() {
    const s = session;
    const d = s.deck === 'tekrar' ? { name: 'Tekrarlar', c: '--hard' } : DECK[s.deck];
    if (!s.total) return renderEmpty(d);
    if (!s.queue.length) return renderDone(d);
    const x = s.queue[0];
    const enFirst = S.dir === 'en';
    const front = enFirst ? x.en : x.tr;
    const pct = Math.round(s.done / s.total * 100);
    const status = isNew(x) ? 'yeni kart' : s.requeued[x.id] ? 'tekrar' : 'tekrar zamanı';
    const tagLabel = x.type === 'w' ? LVL_LABEL[x.lvl] : x.cat;
    const speakBtn = (canSpeak && x.type !== 'k') ? `<button type="button" class="speak" data-speak="${esc(x.en)}" title="Dinle" aria-label="İngilizcesini dinle">${SPEAK_SVG}</button>` : '';
    const exSpeak = (canSpeak && x.exEn) ? `<button type="button" class="speak" data-speak="${esc(x.exEn)}" title="Cümleyi dinle" aria-label="Örnek cümleyi dinle">${SPEAK_SVG}</button>` : '';
    const back = s.shown ? `
      <div class="back">
        <div>
          <div class="meaning-label">${enFirst ? 'Türkçesi' : 'İngilizcesi'}</div>
          <div class="meaning">${esc(enFirst ? x.tr : x.en)}</div>
        </div>
        ${x.type === 'w' ? `<span class="use">${esc(POS[x.pos] || x.pos)}</span>` : ''}
        ${x.use ? `<div><div class="meaning-label">Kullanımı</div><span class="use" style="display:inline-block;margin-top:4px">${esc(x.use)}</span></div>` : ''}
        ${x.exEn ? `<div class="ex"><div class="ex-row"><span class="ex-label">Örnek cümle</span>${exSpeak}</div><span class="en">${highlight(x.exEn, x.type === 'k' ? '' : x.en)}</span><span class="tr">${esc(x.exTr)}</span></div>` : ''}
      </div>` : '';
    $('#view').innerHTML = `
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="study-bar">
          <button type="button" class="pill" data-go="home">← Desteler</button>
          <span class="title">${esc(d.name)}</span>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <span class="count">${s.done} / ${s.total}</span>
          <button type="button" class="pill" id="dirBtn" title="Soru yönünü değiştir">${enFirst ? 'EN → TR' : 'TR → EN'}</button>
        </div>
        <div class="card">
          <div class="card-top"><span class="tag" style="--c:var(${DECK[x.lvl] ? DECK[x.lvl].c : '--muted'})">${esc(tagLabel)}</span><span class="right"><span class="state">${status}</span>${enFirst || s.shown ? speakBtn : ''}</span></div>
          <div class="front">
            <div class="word${front.length > 22 ? ' long' : ''}"><span class="hl">${esc(front)}</span></div>
            ${enFirst && x.type === 'w' && !s.shown ? `<span class="pos">${esc(POS[x.pos] || x.pos)}</span>` : ''}
          </div>
          ${back}
        </div>
        ${s.shown ? `
          <div class="grade">
            <button type="button" class="g hard" data-grade="hard"><b>Zor</b><span>${whenLabel(x, 'hard')}</span></button>
            <button type="button" class="g mid" data-grade="mid"><b>Orta</b><span>${whenLabel(x, 'mid')}</span></button>
            <button type="button" class="g easy" data-grade="easy"><b>Kolay</b><span>${whenLabel(x, 'easy')}</span></button>
          </div>` : `<button type="button" class="reveal" id="revealBtn">Cevabı göster <kbd>Boşluk</kbd></button>`}
      </div>`;
    $('#keys').innerHTML = s.shown
      ? 'Klavye: <kbd>1</kbd> Zor · <kbd>2</kbd> Orta · <kbd>3</kbd> Kolay'
      : 'Klavye: <kbd>Boşluk</kbd> cevabı göster';
  }

  function renderDone(d) {
    const s = session;
    const missed = [...s.missed].map(id => BYID[id]);
    const leftNew = deckItems(s.deck).filter(isNew).length;
    const dueNow = deckItems(s.deck).filter(isDue).length;
    $('#view').innerHTML = `
      <div class="panel">
        <h2>Tur bitti</h2>
        <div class="score">
          <div><b style="color:var(--easy)">${s.res.easy}</b><span>Kolay</span></div>
          <div><b style="color:var(--mid)">${s.res.mid}</b><span>Orta</span></div>
          <div><b style="color:var(--hard)">${s.res.hard}</b><span>Zor</span></div>
        </div>
        <p>${d.name} destesinde ${fmt(leftNew)} yeni kart kaldı${dueNow ? `, ${fmt(dueNow)} kartın da tekrar zamanı geldi` : ''}. Zor dediğin kartlar bir sonraki turda yine karşına çıkacak.</p>
        ${missed.length ? `<div class="missed">${missed.map(x => `<div><b>${esc(x.en)}</b><span>${esc(x.tr)}</span></div>`).join('')}</div>` : ''}
        <div class="row-btns">
          ${(leftNew || dueNow) ? `<button type="button" class="btn primary" data-deck="${s.deck}">${SESSION} kart daha</button>` : ''}
          <button type="button" class="btn" data-go="home">Destelere dön</button>
        </div>
      </div>`;
    $('#keys').innerHTML = '';
  }
  function renderEmpty(d) {
    $('#view').innerHTML = `
      <div class="panel">
        <h2>Şimdilik çalışacak kart yok</h2>
        <p>${esc(d.name)} destesindeki bütün kartları gördün ve hiçbirinin tekrar zamanı gelmedi. Kartlar zamanı geldikçe burada yeniden belirecek. O zamana kadar başka bir deste seçebilirsin.</p>
        <div class="row-btns"><button type="button" class="btn primary" data-go="home">Destelere dön</button></div>
      </div>`;
    $('#keys').innerHTML = '';
  }

  // ---------- Arama ----------
  const norm = s => s.toLocaleLowerCase('tr-TR');
  function renderSearch(fresh) {
    if (fresh || !$('#q')) {
      $('#view').innerHTML = `
        <div style="display:flex;flex-direction:column;gap:12px">
          <div class="study-bar"><button type="button" class="pill" data-go="home">← Desteler</button><span class="title">Kelime ara</span></div>
          <input class="search" id="q" type="search" placeholder="İngilizce ya da Türkçe yaz: abandon, rağmen, katkı…" autocomplete="off" value="${esc(searchQ)}">
          <div class="list-meta" id="listMeta"></div>
          <div class="list" id="list"></div>
          <div class="more" id="more"></div>
        </div>`;
      $('#keys').innerHTML = '';
      setTimeout(() => { const q = $('#q'); if (q) q.focus({ preventScroll: true }); }, 0);
    }
    const q = norm(searchQ.trim());
    const hits = q ? ALL.filter(x => norm(x.en).includes(q) || norm(x.tr).includes(q)) : ALL;
    const shown = hits.slice(0, searchLimit);
    $('#listMeta').textContent = hits.length ? `${fmt(hits.length)} sonuç${hits.length > shown.length ? ', ilk ' + fmt(shown.length) + ' tanesi gösteriliyor' : ''}` : 'Sonuç bulunamadı. Başka bir kelime dene.';
    $('#list').hidden = !shown.length;
    $('#list').innerHTML = shown.map(x => `
      <div class="row">
        <span class="dot" style="--c:var(${DECK[x.lvl].c})"></span>
        <span class="w">${esc(x.en)}<small>${x.type === 'w' ? LVL_LABEL[x.lvl] + ' · ' + esc(POS[x.pos] || x.pos) : esc(x.cat)}${isLearned(x) ? ' · öğrenildi' : ''}</small></span>
        <span class="m">${esc(x.tr)}${x.exEn ? `<em>${esc(x.exEn)}</em>` : ''}</span>
      </div>`).join('');
    $('#more').innerHTML = hits.length > shown.length ? '<button type="button" class="btn" data-act="more">Daha fazla göster</button>' : '';
  }

  // ---------- Olaylar ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.speak) return speak(t.dataset.speak);
    if (t.dataset.deck) return startSession(t.dataset.deck);
    if (t.dataset.go) { view = t.dataset.go; if (view === 'ara') { searchQ = ''; searchLimit = 100; } return render(); }
    if (t.dataset.grade) return grade(t.dataset.grade);
    if (t.id === 'revealBtn') { session.shown = true; return renderStudy(); }
    if (t.id === 'dirBtn') { S.dir = S.dir === 'en' ? 'tr' : 'en'; saveSettings(); return renderStudy(); }
    if (t.id === 'resetBtn') return showConfirm();
    const act = t.dataset.act;
    if (act === 'more') { searchLimit += 300; return renderSearch(false); }
    if (act === 'reset-yes') { store.cards = {}; save(); hideConfirm(); return render(); }
    if (act === 'reset-no') return hideConfirm();
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'q') { searchQ = e.target.value; searchLimit = 100; renderSearch(false); }
  });
  document.addEventListener('keydown', e => {
    if (view !== 'study' || !session || !session.queue.length) return;
    if (e.target.matches('input, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (!session.shown && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); session.shown = true; renderStudy(); }
    else if (session.shown && e.key === '1') { e.preventDefault(); grade('hard'); }
    else if (session.shown && e.key === '2') { e.preventDefault(); grade('mid'); }
    else if (session.shown && e.key === '3') { e.preventDefault(); grade('easy'); }
  });

  function showConfirm() {
    const box = $('#confirmBox');
    box.className = 'confirm'; box.hidden = false;
    box.innerHTML = '<p>Bütün kartların ilerlemesi silinecek ve her şey yeniden "yeni" olacak. Bu işlem geri alınamaz.</p><div class="row-btns"><button type="button" class="btn" data-act="reset-no">Vazgeç</button><button type="button" class="btn danger" data-act="reset-yes">Evet, sıfırla</button></div>';
    window.scrollTo({ top: 0 });
  }
  function hideConfirm() { const box = $('#confirmBox'); box.hidden = true; box.innerHTML = ''; }

  load().then(render).catch(() => {
    $('#view').innerHTML = '<div class="panel"><h2>Kartlar yüklenemedi</h2><p>Kelime dosyaları açılamadı. Sayfayı yenilemeyi dene; sorun sürerse internet bağlantını kontrol et.</p></div>';
    $('#sub').textContent = 'Veri yüklenemedi';
  });
})();
</script>

</body>
</html>
